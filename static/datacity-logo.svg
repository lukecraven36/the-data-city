<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 65.555" width="215" height="65.555">
  <!-- datacity full lockup. Colours are literal on purpose: this file is loaded
       through an img tag, and an external SVG renders in an isolated context
       with no access to the page's CSS custom properties, so a CSS variable
       would resolve to nothing and the gradient would vanish. The values mirror
       the brand cyan #02B1D0 and brand crimson #D10956 tokens in
       src/styles.css, so change them together. The gradient runs cyan at the
       top left to crimson at the bottom right, matching the orientation of
       datacity-logo-icon.svg. Note: XML comments cannot contain a double
       hyphen, so token names are spelled out here rather than quoted. -->
  <defs>
    <linearGradient id="tdc-logo__grad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#02B1D0" />
      <stop offset="1" stop-color="#D10956" />
    </linearGradient>
    <clipPath id="tdc-logo__clip-path">
      <path d="M18.879-.005l22.246 13.113v44.413H18.879zM0 11.147v46.392h2.33l-.017-19.947.789-.477V9.295zM6.293 7.43v50.088H8.62V19.875l.776-.468V5.585zm6.381-3.776v53.882h2.333V13.611l.77-.465V1.815z" />
    </clipPath>
  </defs>
  <path class="tdc-logo__icon" fill="url(#tdc-logo__grad)" clip-path="url(#tdc-logo__clip-path)" d="M0 0h41.125v58.038H0z" />
  <!-- The original wordmark sat about 15 units below the icon's optical
       centre. Keeping the artwork centred within the same canvas lets the
       header align it with adjacent navigation labels without CSS nudges. -->
