name: Check four-page site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify cached site and request limits
        run: python -m unittest discover -s tests -v
      - name: Verify browser script syntax
        run: node --check static/data.js
      - name: Export four pages without API requests
        run: python build_site.py
      - name: Save private review build
        uses: actions/upload-artifact@v4
        with:
          name: data-city-review
          path: dist/
          retention-days: 7
