name: Publish GitHub Pages demonstration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline checks
        run: |
          python -m unittest discover -s tests
          node --check static/discovery.js
          node --check static/cv.js
          node --check static/role.js
          node --check static/interview.js
          node --check static/review-access.js
      - uses: actions/configure-pages@v5
      - name: Build the email-entry demonstration
        run: python build_site.py --base-path /the-data-city/ --email-gate
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
